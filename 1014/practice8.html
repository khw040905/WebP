<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16개의 랜덤한 색 만들기</title>
    <style>
        /* 힌트에 제시된 div 스타일 시트 적용 */
        div {
            display: inline-block;
            width: 150px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h3>16개의 랜덤한 색 만들기</h3>
    <hr>

    <script>
        // 16개의 div 태그를 생성하는 반복문
        for (let i = 0; i < 16; i++) {
            // 0 ~ 255 사이의 랜덤한 R, G, B 값 생성
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);

            // rgb(r,g,b) 문자열 만들기
            let colorstring = "rgb(" + r + "," + g + "," + b + ")";

            // div 태그 생성 및 배경색 지정, 텍스트 출력
            document.write("<div style='background-color:" + colorstring + ";'>");
            document.write(colorstring);
            document.write("</div>");
        }
    </script>

</body>
</html>
