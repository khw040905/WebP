<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오전 오후</title>
</head>
<body>
<script>
    let now = new Date();
    let hour = now.getHours();

    if (hour >= 7 && hour < 18) {
        document.body.style.backgroundColor = "lightskyblue";
    } else {
        document.body.style.backgroundColor = "orange";
    }

    document.write("<h3>오전이면 lightskyblue, 오후이면 orange 배경</h3>");
    document.write("현재 시간: " + now.getHours() + "시, "
        + now.getMinutes() + "분, "
        + now.getSeconds() + "초");
</script>
</body>
</html>
