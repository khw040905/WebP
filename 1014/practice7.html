<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17개의 CSS2 색이름과 색</title>
    <style>
        /* 힌트에 제시된 div 스타일 시트 적용 */
        div {
            display: inline-block;
            width: 60px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h3>17개의 CSS2 색이름과 색</h3>
    <hr>

    <script>
        // 17개의 색 이름이 들어 있는 문자열 배열 선언
        let colorNames = ["maroon", "red", "orange", "yellow", "olive", "purple", 
                          "fuchsia", "white", "lime", "green", "navy", "blue", 
                          "aqua", "teal", "black", "silver", "gray"];

        // 반복문을 통해 각 색이름을 가진 div 태그 출력 및 배경색 지정
        for (let i = 0; i < colorNames.length; i++) {
            document.write("<div style='background-color:" + colorNames[i] + ";'>" + colorNames[i] + "</div>");
        }
    </script>

</body>
</html>
