<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자열 분할</title>
</head>
<body>

    <h3>문자열 분할</h3>
    <hr>

    <script>
        // prompt() 함수로 사용자로부터 문자열 입력받기
        let inputStr = prompt("문자열 입력");

        if (inputStr) {
            // "&" 문자를 기준으로 문자열을 분할하여 배열로 리턴
            let sub = inputStr.split("&");

            // 반복문을 통해 분할된 각 문자열 출력
            for (let i = 0; i < sub.length; i++) {
                document.write(sub[i] + "<br>");
            }
        } else {
            document.write("문자열이 입력되지 않았습니다.");
        }
    </script>

</body>
</html>
