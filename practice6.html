<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>onwheel</title>

<script>
function zoom(e, obj) {
    if (e.deltaY < 0) {
        obj.width += 20;
        obj.height += 20;
    }
    else {
        obj.width -= 20;
        obj.height -= 20;
    }
}
</script>
</head>

<body>
<h3>마우스 휠을 이용한 이미지 확대/축소</h3>
<hr>

<p>
이미지 위에 휠을 굴리면 이미지가 확대되거나 축소되고
아래로 굴리면 이미지가 축소됩니다.
</p>

<img src="spongebob.png" width="150" height="100"
     onwheel="zoom(event, this)">

</body>
</html>
