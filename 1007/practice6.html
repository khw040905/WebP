<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>1 - Chrome</title>
</head>
<body>
<script>
    function big(a, b) {
        if (parseInt(a) > parseInt(b)) {
            return a;
        } else {
            return b;
        }
    }
</script>
<script>
    let b = big("625", "555");
    document.write("큰수=" + b);
</script>
</body>
