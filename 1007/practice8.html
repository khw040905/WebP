<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eval로 수식 계산</title>
</head>
<body>
    <script>
        let exp = prompt("수식 입력");
        let result = eval(exp);

        document.write(exp + " = " + result);
    </script>
</body>
</html>
