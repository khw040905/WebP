<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>암호 입력</title>
</head>
<body>
    <script>
        let password;

        document.write("<h3>암호를 입력하라!</h3>");
        document.write("<hr>");
        while (true) {
            password = prompt("암호를 대라");

            if (password == "you") {
                document.write("통과!");
                break;
            }
        }
    </script>
</body>
</html>
