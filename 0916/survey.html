<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>소프트웨어 기술 선호에 관한 설문</title>
</head>
<body>

    <header>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        <hr>
    </header>

    <section>
        <form>
            <p>
                <strong>학년</strong> 
                <input type="radio" name="grade" value="1">1학년 
                <input type="radio" name="grade" value="2">2학년 
                <input type="radio" name="grade" value="3">3학년 
                <input type="radio" name="grade" value="4">4학년
            </p>

            <p>
                <strong>성별</strong> 
                <input type="radio" name="gender" value="male">남 
                <input type="radio" name="gender" value="female">여
            </p>

            <p>
                <strong>관심 분야</strong> 
                <select name="interest">
                    <option value="mobile">모바일 소프트웨어</option>
                    <option value="web">웹 소프트웨어</option>
                    <option value="ai">인공지능</option>
                </select>
            </p>

            <p>
                <strong>진로</strong> 
                <input type="checkbox" name="job" value="dev" checked>개발 
                <input type="checkbox" name="job" value="plan">기획 
                <input type="checkbox" name="job" value="sales">영업 
                <input type="checkbox" name="job" value="startup">창업
            </p>

            <p>
                <strong>남기고 싶은 말</strong><br>
                <textarea rows="5" cols="50" placeholder="글을 남겨주세요"></textarea>
            </p>
        </form>
    </section>

    <footer>
        <hr>
        <p>Copyright 2022 by Kitae</p>
    </footer>

</body>
</html>
