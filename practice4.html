<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이미지 커서 만들기</title>

<style>
#cursor {
    position: absolute;
    width: 30px;
    height: 30px;
}
</style>

<script>
function moveCursor(e) {
    let cursor = document.getElementById("cursor");
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
}
</script>
</head>

<body onmousemove="moveCursor(event)">

<h3>이미지 커서 만들기</h3>
<hr>

<p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다.</p>

<img id="cursor" src="spongebob.png">

</body>
</html>
