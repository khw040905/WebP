<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>라디오 버튼과 이미지 출력</title>

    <script>
        function changeImage() {
            let radios = document.getElementsByName("fruit");
            let img = document.getElementById("fruitImage");

            if(radios[0].checked) {
                img.src = "banana.png";
            }
            else if(radios[1].checked) {
                img.src = "mango.png";
            }
            else if(radios[2].checked) {
                img.src = "apple.png";
            }
        }
    </script>
</head>

<body>
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
    <hr>

    <input type="radio" name="fruit" onclick="changeImage()">바나나
    <input type="radio" name="fruit" onclick="changeImage()">망고
    <input type="radio" name="fruit" onclick="changeImage()">사과

    <br><br>

    <img id="fruitImage" width="150" height="150">

</body>
</html>
