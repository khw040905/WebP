<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>onekeydown</title>
<script>
function calculate(e) {
    if (e.key == "Enter") {
        let formula = document.getElementById("formula").value;
        document.getElementById("result").value = eval(formula);
    }
}
</script>
</head>

<body>
<h3>계산기 만들기</h3>
<hr>

<p>수식을 입력하고 &lt;Enter&gt;를 입력하세요.</p>

식 <input type="text" id="formula" onkeydown="calculate(event)"><br>
값 <input type="text" id="result">

</body>
</html>
