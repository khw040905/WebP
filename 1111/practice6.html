<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>setInterval 시계</title>
<script>
let id;
let running = false;

function clock() {
    let now = new Date();
    document.getElementById("clock").innerHTML =
        now.toLocaleTimeString("ko-KR");
}

function toggleClock() {
    if (running) {
        clearInterval(id);
        running = false;
    } else {
        clock();
        id = setInterval(clock, 1000);
        running = true;
    }
}
</script>
</head>
<body onload="clock()">
<h3>div 태그에 시계 만들기</h3>
<p>시계를 클릭하면 멈추고 다시 클릭하면 현재 시각부터 갑니다.</p>
<hr>
<div id="clock" onclick="toggleClock()"></div>
</body>
</html>
