<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>screen 객체 활용</title>
<script>
window.onload = function() {
    if (screen.width < 1280 || screen.height < 1024) {
        alert("스크린 해상도가 낮습니다!");
    }
};
</script>
</head>
<body>
<h3>screen 객체 활용</h3>
<hr>
<p>
스크린의 해상도가 1280x1024보다 작은 경우
웹 페이지가 정상적으로 출력되지 않을 수 있음을 알려줍니다.
</p>
</body>
</html>
