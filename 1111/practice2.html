<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML5</title>
<script>
function openWindow() {
    let win = window.open("", "", "width=200,height=80,left=500,top=400");
    win.document.write("<p>접속 감사합니다!</p>");
    win.document.write("<p>열심히 하세요</p>");
    win.document.title = "환영";
    win.document.body.style.backgroundColor = "yellowgreen";
}
</script>
</head>
<body onload="openWindow()">
<h3>HTML5</h3>
<hr>
<p>
HTML5를 학습하는 사이트입니다.<br>
여기서 HTML5, CSS3, 자바스크립트를<br>
배울 수 있습니다.
</p>
</body>
</html>
