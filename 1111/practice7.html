<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>산수 문제</title>
<style>
    .question {
        display: flex;
        align-items: center;
        height: 24px;
    }

    .formula {
        width: 50px;
        display: inline-block;
    }

    input {
        width: 65px;
        height: 18px;
        box-sizing: border-box;
    }
</style>
<script>
function grade() {
    let answers = [30, 22, 46, 28];
    let count = 0;

    for (let i = 0; i < 4; i++) {
        let input = document.getElementById("a" + i);
        let question = document.getElementById("q" + i);

        if (input.value.trim() !== "" &&
            Number(input.value) === answers[i]) {
            count++;
        } else {
            question.style.textDecoration = "line-through";
        }
    }

    document.getElementById("score").innerHTML = count;
}
</script>
</head>
<body>
<h3>산수 문제를 풀어 봅시다.</h3>
<p>수식을 계산하여 답을 입력하고 채점 버튼을 누르세요.</p>
<hr>

<div class="question">
    <span class="formula" id="q0">5*6</span>
    <input id="a0">
</div>
<div class="question">
    <span class="formula" id="q1">7+5*3</span>
    <input id="a1">
</div>
<div class="question">
    <span class="formula" id="q2">23*2</span>
    <input id="a2">
</div>
<div class="question">
    <span class="formula" id="q3">35-7</span>
    <input id="a3">
</div>

<button onclick="grade()">채점</button>
<span id="score">0</span>
</body>
</html>
