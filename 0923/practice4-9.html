<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>text-shadow와 box-shadow</title>
    <style>

        h3 {
            color: yellowgreen;
            text-shadow: 2px 2px 5px green; /* x축 y축 번짐색상 */
            font-size: 30px;
        }

        img {
            width: 150px;
            height: 120px;
            margin: 5px;
            border: 1px solid gray;
        }

        img:hover {
            box-shadow: 5px 5px 10px gray; 
        }
    </style>
</head>
<body>

    <h3>Most Visited Pages</h3>
    <hr>

    
    <a href="https://www.naver.com" target="_blank"><img src="naver.png" alt="네이버"></a>
    <a href="https://www.chosun.com" target="_blank"><img src="news.png" alt="조선일보"></a>
    <a href="https://www.amazon.com" target="_blank"><img src="amazon.png" alt="아마존"></a>

</body>
</html>
