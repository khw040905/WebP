<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>색 테이블 만들기</title>

<style>
    table {
        border-collapse: collapse;
    }

    td, th {
        border: 1px solid gray;
        padding: 5px;
        text-align: center;
    }

    .color {
        width: 60px;
    }
</style>

</head>

<body>

<h3>색 이름과 코드</h3>
<hr>

<table>

    <tr>
        <th>이름</th>
        <th>코드</th>
        <th>색</th>

        <th>이름</th>
        <th>코드</th>
        <th>색</th>
    </tr>

    <tr>
        <td>Brown</td>
        <td>#A52A2A</td>
        <td class="color" style="background-color: Brown;"></td>

        <td>DeepSkyBlue</td>
        <td>#00BFFF</td>
        <td class="color" style="background-color: DeepSkyBlue;"></td>
    </tr>

    <tr>
        <td>BlueViolet</td>
        <td>#8A2BE2</td>
        <td class="color" style="background-color: BlueViolet;"></td>

        <td>Gold</td>
        <td>#FFD700</td>
        <td class="color" style="background-color: Gold;"></td>
    </tr>

    <tr>
        <td>DarkOrange</td>
        <td>#FF8C00</td>
        <td class="color" style="background-color: DarkOrange;"></td>

        <td>OliveDrab</td>
        <td>#6B8E23</td>
        <td class="color" style="background-color: OliveDrab;"></td>
    </tr>
</table>
</body>
</html>
