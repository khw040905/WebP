<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>:hover 활용</title>

<style>
div.card {
    width: 100px;
    height: 130px;
    background-image: url("back.jpg");
    background-size: 100px 130px;
}

div.card:hover {
    background-image: url("front.jpg");
}
</style>

</head>

<body>

<h3>:hover 활용</h3>
<hr>

<p>
마우스를 올리면<br>
카드의 앞면이 보인다.
</p>

<div class="card"></div>

</body>
</html>
