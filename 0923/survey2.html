<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>소프트웨어 기술 선호에 관한 설문</title>

<link href="survey2.css" type="text/css" rel="stylesheet">
</head>

<body>

<h1>설문지</h1>

<p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>

<hr>

<form>

    <div>
        <label>학년</label>
        <input type="radio" name="grade" checked>1학년
        <input type="radio" name="grade">2학년
        <input type="radio" name="grade">3학년
        <input type="radio" name="grade">4학년
    </div>

    <div>
        <label>성별</label>
        <input type="radio" name="gender" checked>남
        <input type="radio" name="gender">여
    </div>

    <div>
        <label>관심 분야</label>
        <select>
            <option>모바일 소프트웨어</option>
            <option>웹 개발</option>
            <option>게임</option>
            <option>인공지능</option>
        </select>
    </div>

    <div>
        <label>진로(다중 선택)</label>
        <input type="checkbox">개발
        <input type="checkbox">기획
        <input type="checkbox">영상
        <input type="checkbox">촬영
    </div>

    <div class="message">
        <label>남기고 싶은 말</label>
        <textarea placeholder="글을 남겨주세요"></textarea>
    </div>

</form>

<footer>
    Copyright 2022 by Kitae
</footer>

</body>
</html>
