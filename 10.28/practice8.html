<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>transform:scale</title>
</head>

<body>
    <h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
    <hr>

    <img id="obj" src="spongebob.png"
         width="150" height="150"
         onclick="expand()">

    <script>
        let count = 1;

        function expand() {
            let obj = document.getElementById("obj");

            if(count < 4) {
                count++;
            }

            obj.style.transform = "scale(" + count + ",1)";
        }
    </script>

</body>
</html>
