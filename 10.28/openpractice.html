<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>갬블링 게임</title>

    <style>
        span {
            font-size: 40px;
            font-style: italic;
            color: blue;
            padding: 5px;
            border: 1px solid pink;
            cursor: pointer;
        }

        div {
            margin-top: 15px;
        }

        #result {
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h3>갬블링 게임</h3>

    <p>
        각 숫자를 클릭하면 0에서 2사이의 난수로 바뀝니다.
        모두 같은 수가 나오면 승리합니다.
    </p>

    <hr>

    <span id="num1" onclick="change(this)">0</span>
    <span id="num2" onclick="change(this)">0</span>
    <span id="num3" onclick="change(this)">0</span>

    <div>
        <span id="result" onclick="reset()"></span>
    </div>

    <script>
        let count = 0;

        function change(obj) {
            if(obj.dataset.clicked == "true" || count == 3) {
                return;
            }

            let n = Math.floor(Math.random() * 3);

            obj.innerHTML = n;
            obj.dataset.clicked = "true";

            count++;

            if(count == 3) {
                let a = document.getElementById("num1").innerHTML;
                let b = document.getElementById("num2").innerHTML;
                let c = document.getElementById("num3").innerHTML;

                if(a == b && b == c) {
                    document.getElementById("result").innerHTML =
                        "Success(click here to do again)";
                }
                else {
                    document.getElementById("result").innerHTML =
                        "Fail(click here to do again)";
                }
            }
        }

        function reset() {
            document.getElementById("num1").innerHTML = 0;
            document.getElementById("num2").innerHTML = 0;
            document.getElementById("num3").innerHTML = 0;

            document.getElementById("num1").dataset.clicked = "false";
            document.getElementById("num2").dataset.clicked = "false";
            document.getElementById("num3").dataset.clicked = "false";

            document.getElementById("result").innerHTML = "";

            count = 0;
        }
    </script>

</body>
</html>
