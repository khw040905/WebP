<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>transform:rotate</title>
</head>

<body>
    <h3>클릭하면 90도 회전합니다.</h3>
    <hr>

    <img id="obj" src="spongebob.png"
         width="150" height="150"
         onclick="rotate()">

    <script>
        let angle = 0;

        function rotate() {
            let obj = document.getElementById("obj");

            angle = angle + 90;

            obj.style.transform = "rotate(" + angle + "deg)";
        }
    </script>

</body>
</html>
