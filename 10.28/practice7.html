<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>transform:rotate</title>
</head>

<body>
    <h3>클릭하면 90도 회전합니다.</h3>
    <hr>

    <img id="obj" src="spongebob.png"
         width="150" height="150"
         onclick="rotate()">

    <script>
        let rotated = false;

        function rotate() {
            let obj = document.getElementById("obj");

            if(rotated == false) {
                obj.style.transform = "rotate(90deg)";
                rotated = true;
            }
        }
    </script>

</body>
</html>
