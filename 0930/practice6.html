<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>animation</title>

<style>
@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

img {
    width: 100px;
    animation: spin 1s infinite;
}
</style>

</head>

<body>

<h3>어지러워요</h3>
<hr>

<img src="spongebob.png">

</body>
</html>
