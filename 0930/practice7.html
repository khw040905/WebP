<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transition</title>

<style>
img {
    width: 100px;
    height: 100px;
    transition: width 2s;
}

img:hover {
    width: 200px;
}
</style>

</head>

<body>

<h3>마우스를 올려봐요</h3>
<hr>

<img src="spongebob.png">

</body>
</html>
