<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>animation</title>

<style>
@keyframes swing {
    0% {
        transform: rotate(-90deg);
    }

    50% {
        transform: rotate(90deg);
    }

    100% {
        transform: rotate(-90deg);
    }
}

img {
    width: 100px;
    animation: swing 1s infinite;
}
</style>

</head>

<body>

<h3>어지러워요</h3>
<hr>

<img src="spongebob.png">

</body>
</html>
