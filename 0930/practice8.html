<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리스트로 수직 메뉴 만들기</title>
    <style>
        /* ul 기본 스타일 제거 및 박스 설정 */
        ul {
            list-style-type: none; /* 불릿 기호 제거 */
            margin: 0;
            padding: 0;
            width: 150px; /* 메뉴 전체 너비 */
            background-color: darkolivegreen; /* 배경색 설정 */
        }

        /* 링크 항목 스타일 */
        li a {
            display: block; /* 영역 전체를 클릭 가능하게 설정 */
            color: khaki;    /* 기본 글자색 */
            padding: 8px 16px;
            text-decoration: none; /* 밑줄 제거 */
        }

        /* 마우스를 올렸을 때 스타일 */
        li a:hover {
            background-color: darkkhaki; /* 마우스 올렸을 때 배경색 */
            color: brown;               /* 마우스 올렸을 때 글자색 (Espresso 부분) */
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Espresso</a></li>
        <li><a href="#">Cappuccino</a></li>
        <li><a href="#">Cafe Latte</a></li>
        <li><a href="#">F.A.Q</a></li>
    </ul>

</body>
</html>
